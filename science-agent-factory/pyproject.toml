[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "science-agent-factory"
version = "0.6.0"
description = "Scientific task generation with native Harbor harnesses and audited trajectories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-codex==0.147.0",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[project.scripts]
saf = "science_agent_factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/science_agent_factory"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
