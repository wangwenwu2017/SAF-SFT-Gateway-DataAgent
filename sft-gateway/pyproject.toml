[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sft-gateway"
version = "0.3.2"
description = "A transparent OpenAI-compatible gateway for recording SFT trajectories"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "anyio>=4",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sft-gateway = "sft_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["sft_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
